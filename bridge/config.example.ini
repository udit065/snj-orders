[bridge]
# Where Tally listens on this server. Keep it localhost: port 9000 must never be opened to the internet.
tally_url = http://localhost:9000
# Exact company name as shown in Tally. Leave blank to use whichever company is open.
company = SN JAIN INDUSTRIES PVT LTD - (26-27)
# The orders website, and the secret token set there as BRIDGE_TOKEN.
website_url = https://orders.example.com
token = change-me
# Which orders to copy: from this many days ago up to this many days ahead.
days_back = 120
days_ahead = 60
# Tally is asked for this many days at a time; seconds to wait for each answer.
days_per_request = 31
timeout = 300
# Every round (every 10 minutes when run by Windows' task) re-reads the last
# quick_days_back days: new orders, edits and deliveries. A full copy of everything is
# sent once at the start and once a night after full_sync_hour, a month at a time,
# spending at most minutes_per_round of each round on it and carrying on next round.
every_minutes = 10
minutes_per_round = 7
quick_days_back = 10
full_sync_hour = 2
# Writing new orders from the website into Tally. Off until a test copy of the company
# is ready: set allow_writes = yes and write_company to that copy's exact name.
# Orders go only into write_company, and only Sales Orders are ever created.
allow_writes = no
write_company =
# Copied from orders staff entered by hand in this Tally: the sales ledger each line
# names, and the GST registration every voucher binds to.
sales_ledger = Sale Central 5%
gst_registration = Uttar Pradesh Registration
company_gstin = 09ABHCS0526J1Z7
