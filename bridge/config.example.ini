[bridge]
# Where Tally listens on this server. Keep it localhost: port 9000 must never be opened to the internet.
tally_url = http://localhost:9000
# Exact company name as shown in Tally. Leave blank to use whichever company is open.
company =
# The orders website, and the secret token set there as BRIDGE_TOKEN.
website_url = https://orders.example.com
token = change-me
# How far back to copy orders, and how often to sync.
days_back = 365
every_minutes = 5
