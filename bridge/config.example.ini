[bridge]
# Where Tally listens on this server. Keep it localhost: port 9000 must never be opened to the internet.
tally_url = http://localhost:9000
# Exact company name as shown in Tally. Leave blank to use whichever company is open.
company = SN JAIN INDUSTRIES PVT LTD - (26-27)
# The orders website, and the secret token set there as BRIDGE_TOKEN.
website_url = https://orders.example.com
token = change-me
# Which orders to copy: from this many days ago up to this many days ahead.
days_back = 120
days_ahead = 60
# Tally is asked one week at a time; seconds to wait for each answer.
chunk_days = 7
timeout = 300
# Every few minutes a quick sync reads only the last quick_days_back days (new orders,
# edits and deliveries). Once a night, after full_sync_hour, everything is read again.
every_minutes = 15
quick_days_back = 10
full_sync_hour = 2
